plugins {
    id 'java'
}

group = 'de.mcterranova'
version = '1.0.0'
description = 'Nexo furniture crops that stand in water with a real block outline.'

ext {
    paperVersion = '26.3.build.222-stable'
    nexoVersion = '1.29.1'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "Nexo"
        url = "https://repo.nexomc.com/releases"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:${paperVersion}")
    compileOnly("com.nexomc:nexo:${nexoVersion}")
    testImplementation("io.papermc.paper:paper-api:${paperVersion}")
    testImplementation("com.nexomc:nexo:${nexoVersion}") { transitive = false }
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

test {
    useJUnitPlatform()
}
